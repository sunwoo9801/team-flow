name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: teamflow1234
          POSTGRES_DB: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgresql://teamflow:teamflow1234@localhost:5432/teamflow?schema=public
      JWT_SECRET: e2e-test-secret
      JWT_REFRESH_SECRET: e2e-test-refresh-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      GOOGLE_CALLBACK_URL: http://localhost:4000/api/auth/google/callback
      # NOTE: 이 워크플로우는 로그인/보드/D&D 플로우만 검증하며 첨부파일(S3) 엔드포인트는
      # 호출하지 않는다. 아래 값은 AttachmentService가 부팅 시 S3Client를 생성할 때 필요한
      # 자리 표시자일 뿐, 실제 AWS 자격증명이 아니며 절대 실제 키를 넣지 않는다.
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: dummy-bucket
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      # 이 워크플로우는 비밀번호 재설정 이메일 발송 플로우도 호출하지 않는다. 아래 값은
      # MailerService가 부팅 시 SMTP transporter를 생성할 때 필요한 자리 표시자일 뿐,
      # 실제 SMTP 자격증명이 아니며 절대 실제 값을 넣지 않는다.
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: dummy@example.com
      SMTP_PASS: dummy
      MAIL_FROM: dummy@example.com
      FRONTEND_URL: http://localhost:3000
      E2E_FRONTEND_URL: http://localhost:3000
      E2E_BACKEND_URL: http://localhost:4000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://teamflow:teamflow1234@localhost:5432/teamflow?schema=public

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend (background)
        working-directory: backend
        run: |
          nohup npm run start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/auth/me || true)
            # 401(인증 필요)이면 서버가 정상 응답 중이라는 뜻 — 000은 연결 자체가 안 된 상태
            if [ "$code" != "000" ]; then
              echo "backend is up (HTTP $code)"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/backend.pid)" 2>/dev/null; then
              echo "backend process exited early"
              break
            fi
            sleep 2
          done
          echo "----- backend.log -----"
          cat /tmp/backend.log
          exit 1

      - name: Install Playwright browsers
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Print backend log
        if: always()
        run: cat /tmp/backend.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
